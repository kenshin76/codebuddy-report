name: Publish report to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out report
        uses: actions/checkout@v6
      - name: Validate report data and calculations
        run: |
          python3 scripts/build_report.py --check
          python3 scripts/test_report.py
          node --check app.js
          node scripts/test_costs.js
          node scripts/test_pricing.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html styles.css app.js data.js pricing.js costs.js .nojekyll _site/
          cp -R assets sources _site/
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
